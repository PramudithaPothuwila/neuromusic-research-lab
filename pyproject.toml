[project]
name = "neuromusic-research-lab"
version = "0.1.0"
description = "Reproducible research platform for analysing EEG recordings collected during music listening."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "mne>=1.8",
    "statsmodels>=0.14.4",
    "scikit-learn>=1.5",
    "plotly>=5.24",
    "matplotlib>=3.9",
    "streamlit>=1.40",
    "pyarrow>=18.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.9",
    "joblib>=1.4",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.1"]
# Licensed stimulus-audio acquisition (operator must hold rights; see ingestion/stimuli.py).
stimuli = ["yt-dlp>=2025.1.1"]

[project.scripts]
neuromusic = "neuromusic.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuromusic"]

[tool.hatch.build.targets.wheel.force-include]
"src/neuromusic/reporting/templates" = "neuromusic/reporting/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:mne.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "dashboard", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD002", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["neuromusic"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
